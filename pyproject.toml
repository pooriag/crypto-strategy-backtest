[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptobt"
version = "0.1.0"
description = "Walk-forward momentum backtests on BTC and ETH with transaction costs, bootstrap confidence intervals and the deflated Sharpe ratio."
authors = [{ name = "Pouria Golestani" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
